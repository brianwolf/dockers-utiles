services:
  fortivpn:
    build: build/
    container_name: fortivpn-client
    dns:
      - 1.1.1.1
      - 8.8.8.8
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./config/vpn.conf:/etc/openfortivpn/vpn.conf:ro
    restart: unless-stopped

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard-gateway
    network_mode: "service:fortivpn"
    depends_on:
      - fortivpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - SERVERURL=lobezzzno.com.ar # <-- Pon aquí la IP pública o dominio DuckDNS de Argentina
      - SERVERPORT=51820
      - PEERS=paraguay
      - PEERDNS=1.1.1.1
      - ALLOWEDIPS=0.0.0.0/0
    volumes:
      - ./wireguard-config:/config
    restart: unless-stopped
