services:
  fortivpn:
    build: build/
    container_name: fortivpn-client
    dns:
      - 1.1.1.1
      - 8.8.8.8
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/ppp:/dev/ppp
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    volumes:
      - ./config/vpn.conf:/etc/openfortivpn/vpn.conf:ro
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-exitnode
    network_mode: "service:fortivpn"
    depends_on:
      - fortivpn
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=tskey-auth-${TS_AUTHKEY}
      - TS_HOSTNAME=gateway-argentina
      - TS_EXTRA_ARGS=--advertise-exit-node
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    restart: unless-stopped
